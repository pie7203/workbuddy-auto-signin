name: Build Windows EXE

# 在 GitHub 云端的 Windows 环境里打包出 .exe，无需你本地安装 Python。
# 使用前提：把本仓库 fork 到你自己账号下，把本文件放到仓库的
# .github/workflows/build-exe.yml，推送后在 Actions 页面手动运行。

on:
  workflow_dispatch:        # 手动触发
  push:
    tags:
      - "v*"               # 打版本标签时自动打包并发布到 Release

permissions:
  contents: write

jobs:
  build:
    name: Package EXE (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build WorkBuddy EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name workbuddy-signin `
            signin.py

      - name: Build Qoder CN EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name qoder-signin `
            qoder_signin.py

      - name: Zip artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/workbuddy-signin/*" -DestinationPath "workbuddy-signin-windows.zip"
          Compress-Archive -Path "dist/qoder-signin/*"    -DestinationPath "qoder-signin-windows.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            workbuddy-signin-windows.zip
            qoder-signin-windows.zip

      # 打 v* 标签时，自动把两个 zip 挂到对应 Release 上。
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workbuddy-signin-windows.zip
            qoder-signin-windows.zip
