name: Build WorkBuddy EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 重点：不要加 cache: pip ！这个项目没有依赖清单文件

      - name: 安装打包工具 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: 打包脚本
        run: |
          pyinstaller --onefile --console --name workbuddy-signin signin.py
          pyinstaller --onefile --console --name qoder-signin qoder_signin.py

      - name: 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-auto-signin-exe
          path: dist/*.exe
